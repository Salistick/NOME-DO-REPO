name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TTSLIVE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'manual' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Prepare build metadata
        run: python build_scripts/prepare_windows_build_assets.py

      - name: Build EXE
        run: python -m PyInstaller --clean bot_live.spec

      - name: Sign EXE if certificate is configured
        shell: powershell
        env:
          WINDOWS_CODESIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
          WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: .\build_scripts\sign_windows_artifacts.ps1 -Files dist\TTSLive.exe

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: powershell
        run: iscc /DTTSLiveVersion=$env:TTSLIVE_VERSION installer.iss

      - name: Sign installer if certificate is configured
        shell: powershell
        env:
          WINDOWS_CODESIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
          WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: .\build_scripts\sign_windows_artifacts.ps1 -Files dist\TTSLiveInstaller.exe

      - name: Upload artifact exe
        uses: actions/upload-artifact@v6
        with:
          name: TTSLive-windows-exe
          path: dist/TTSLive.exe

      - name: Upload artifact installer
        uses: actions/upload-artifact@v6
        with:
          name: TTSLive-installer
          path: dist/TTSLiveInstaller.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/TTSLive.exe
            dist/TTSLiveInstaller.exe
          generate_release_notes: true
